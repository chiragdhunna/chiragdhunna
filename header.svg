<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Chirag Dhunna — Full-Stack and Mobile Engineer, terminal boot header">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ff47"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e8ff47" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .cover{fill:#0d1117;transform-box:fill-box;transform-origin:100% 50%;animation:reveal 1.4s steps(34) forwards}
    @keyframes reveal{to{transform:scaleX(0)}}
    .name{opacity:0;animation:fade .9s ease-out .15s forwards}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(340px)}}
  </style>

  <rect width="1000" height="340" rx="14" fill="#0d1117"/>
  <rect width="1000" height="340" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="339" rx="14" fill="none" stroke="#30363d"/>

  <!-- title bar -->
  <path d="M0 14a14 14 0 0 1 14-14h972a14 14 0 0 1 14 14v26H0z" fill="#161b22"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text x="500" y="25" text-anchor="middle" font-size="13" fill="#8b949e">chirag@arch:~ — zsh</text>

  <!-- name -->
  <g class="name">
    <text x="40" y="118" font-size="58" font-weight="800" letter-spacing="3" fill="url(#g)" filter="url(#glow)">CHIRAG DHUNNA</text>
    <text x="42" y="146" font-size="15" letter-spacing="6" fill="#8b949e">FULL-STACK  ·  MOBILE  ·  LLM  ENGINEER</text>
  </g>

  <!-- typed lines -->
  <g font-size="17">
    <text x="40" y="196"><tspan fill="#e8ff47">$</tspan><tspan fill="#c9d1d9"> whoami</tspan><tspan fill="#8b949e">   →   </tspan><tspan fill="#58a6ff">software engineer @ Tata Consultancy Services</tspan></text>
    <rect class="cover" x="36" y="178" width="920" height="26" style="animation-delay:.9s"/>

    <text x="40" y="232"><tspan fill="#e8ff47">$</tspan><tspan fill="#c9d1d9"> cat mission.txt</tspan><tspan fill="#8b949e">   →   </tspan><tspan fill="#c9d1d9">ship LLM-powered products at enterprise scale</tspan></text>
    <rect class="cover" x="36" y="214" width="920" height="26" style="animation-delay:2.4s"/>

    <text x="40" y="268"><tspan fill="#e8ff47">$</tspan><tspan fill="#c9d1d9"> uptime</tspan><tspan fill="#8b949e">   →   </tspan><tspan fill="#27c93f">10,000+ concurrent users · 99.9% uptime</tspan></text>
    <rect class="cover" x="36" y="250" width="920" height="26" style="animation-delay:3.9s"/>

    <text x="40" y="304" fill="#e8ff47">$ <tspan class="cur" fill="#ff6b35">█</tspan></text>
  </g>

  <!-- scanline -->
  <rect class="scan" x="1" y="0" width="998" height="14" fill="#e8ff47" opacity="0.035"/>
</svg>
