<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-label="Skills shown as htop style CPU meters">
  <style>
    text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:15px;fill:#c9d1d9}
    .lbl{font-weight:700}
    .dim{fill:#8b949e;font-size:13px}
    .bar{transform-box:fill-box;transform-origin:0% 50%;transform:scaleX(0);animation:fill 1.6s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes fill{to{transform:scaleX(1)}}
    .shimmer{animation:sh 3s ease-in-out infinite}
    @keyframes sh{50%{opacity:.75}}
  </style>

  <rect width="1000" height="410" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="999" height="409" rx="14" fill="none" stroke="#30363d"/>
  <text x="30" y="36" class="dim" style="font-size:15px"><tspan fill="#e8ff47">$</tspan> htop --user chirag --sort-by=impact</text>
  <text x="30" y="68" class="dim">  PROCESS</text>
  <text x="250" y="68" class="dim">LOAD</text>
  <text x="730" y="68" class="dim">USED FOR</text>

  <!-- rows: y = 100 + i*40 -->
  <g class="shimmer">
    <text x="30" y="104" class="lbl" fill="#58a6ff">Flutter · Dart</text>
    <rect x="250" y="90" width="450" height="18" rx="3" fill="#161b22"/>
    <rect class="bar" x="250" y="90" width="405" height="18" rx="3" fill="#58a6ff" style="animation-delay:.1s"/>
    <text x="730" y="104" class="dim">cross-platform mobile apps</text>

    <text x="30" y="144" class="lbl">React · JavaScript</text>
    <rect x="250" y="130" width="450" height="18" rx="3" fill="#161b22"/>
    <rect class="bar" x="250" y="130" width="382" height="18" rx="3" fill="#61dafb" style="animation-delay:.25s"/>
    <text x="730" y="144" class="dim">real-time chatbot interfaces</text>

    <text x="30" y="184" class="lbl">Java · Spring Boot</text>
    <rect x="250" y="170" width="450" height="18" rx="3" fill="#161b22"/>
    <rect class="bar" x="250" y="170" width="360" height="18" rx="3" fill="#27c93f" style="animation-delay:.4s"/>
    <text x="730" y="184" class="dim">microservices + OAuth2</text>

    <text x="30" y="224" class="lbl">AWS · Azure</text>
    <rect x="250" y="210" width="450" height="18" rx="3" fill="#161b22"/>
    <rect class="bar" x="250" y="210" width="370" height="18" rx="3" fill="#ff9900" style="animation-delay:.55s"/>
    <text x="730" y="224" class="dim">SA Associate + SA Expert</text>

    <text x="30" y="264" class="lbl">LLM · Prompting</text>
    <rect x="250" y="250" width="450" height="18" rx="3" fill="#161b22"/>
    <rect class="bar" x="250" y="250" width="385" height="18" rx="3" fill="#e8ff47" style="animation-delay:.7s"/>
    <text x="730" y="264" class="dim">workflows + API integration</text>

    <text x="30" y="304" class="lbl">Firebase · Node.js</text>
    <rect x="250" y="290" width="450" height="18" rx="3" fill="#161b22"/>
    <rect class="bar" x="250" y="290" width="350" height="18" rx="3" fill="#ffca28" style="animation-delay:.85s"/>
    <text x="730" y="304" class="dim">backends, FCM, auth</text>

    <text x="30" y="344" class="lbl">PostgreSQL · Mongo · MySQL</text>
    <rect x="250" y="330" width="450" height="18" rx="3" fill="#161b22"/>
    <rect class="bar" x="250" y="330" width="320" height="18" rx="3" fill="#bc8cff" style="animation-delay:1s"/>
    <text x="730" y="344" class="dim">data modelling &amp; queries</text>

    <text x="30" y="384" class="lbl">Python · C++ · Fastlane</text>
    <rect x="250" y="370" width="450" height="18" rx="3" fill="#161b22"/>
    <rect class="bar" x="250" y="370" width="300" height="18" rx="3" fill="#ff6b35" style="animation-delay:1.15s"/>
    <text x="730" y="384" class="dim">scripting, DSA, CI/CD</text>
  </g>
</svg>
